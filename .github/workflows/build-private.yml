name: Build ZMK firmware with private macros
# Manual only. Macro text comes from repository secrets. The uploaded firmware is
# NOT encrypted, so on a public repo its macro text is readable by anyone who can
# download artifacts. Delete the run when finished.
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    steps:
      - uses: actions/checkout@v4

      - name: Generate private macros
        env:
          MACRO0: ${{ secrets.MACRO0 }}
          MACRO1: ${{ secrets.MACRO1 }}
        run: python3 tools/gen_macros.py config/private_macros.dtsi

      - name: West update
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export

      - name: Build
        run: >
          west build -s zmk/app -d build/studio -b alu40 -S studio-rpc-usb-uart
          -- -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DCONFIG_ZMK_STUDIO=y

      - uses: actions/upload-artifact@v4
        with:
          name: alu40-studio-private
          path: build/studio/zephyr/zmk.uf2
          retention-days: 1
